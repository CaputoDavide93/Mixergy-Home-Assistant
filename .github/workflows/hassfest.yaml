name: Hassfest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly to catch HA core breaking changes
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  validate:
    name: Validate with Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93

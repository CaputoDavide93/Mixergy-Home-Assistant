name: Dependabot auto-merge

# Approves a Dependabot pull request and turns on auto-merge. GitHub then
# merges it only once every required check is green. Pull requests from anyone
# else are ignored. No code from the pull request is checked out or run.
on: pull_request_target

permissions: {}

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Approve and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"

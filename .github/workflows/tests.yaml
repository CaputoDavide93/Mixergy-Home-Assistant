name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly against latest published homeassistant (requirements_test.txt is
    # unpinned on purpose): catches core API churn between our own pushes,
    # so a new HA release can't break the integration unnoticed.
    - cron: "0 9 * * 1"

jobs:
  tests:
    name: Run pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Must track HA core's floor (2026.8 needs >=3.14.2). On an older
          # python, pip silently resolves an OLD homeassistant and the suite
          # goes green against a core nobody runs any more.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install dependencies
        run: pip install -r requirements_test.txt

      - name: Check generated entity docs are current
        run: python tools/gen_entity_docs.py --check

      - name: Run tests
        run: pytest tests/ -v --tb=short

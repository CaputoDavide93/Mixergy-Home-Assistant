name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly latest-HA canary catches core API churn between releases.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The supported floor. Type-checking against the OLDEST supported
          # Home Assistant is the stricter direction — it catches use of APIs
          # that do not exist there yet — and it keeps mypy's python_version
          # (3.13, see pyproject) consistent with the interpreter and with the
          # HA source it has to parse. Checking against 2026.8.2 instead fails
          # before reaching our code: that release contains 3.14-only syntax,
          # which mypy cannot parse while targeting 3.13.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements_test.txt
            .github/workflows/tests.yaml

      - name: Install dependencies
        # mypy needs Home Assistant present to resolve its types. pycares<5 is
        # the same pin the minimum matrix leg uses: HA 2025.8 pins aiodns 3.5
        # but not pycares, and pycares 5 removed symbols aiodns 3.5 imports.
        run: >-
          python -m pip install -r requirements_test.txt
          homeassistant==2025.8.0 "pycares<5"

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy custom_components/mixergy_tank

  compatibility:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Minimum HA 2025.8.0
            python: "3.13"
            homeassistant: "2025.8.0"
            minimum: true
          - name: Current HA 2026.8.2
            python: "3.14"
            homeassistant: "2026.8.2"
            minimum: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          # The big dependency (homeassistant==<matrix version>) comes from
          # the workflow, not requirements_test.txt — include this file in
          # the key so an HA version bump rotates the cache instead of
          # leaving it permanently stale for that leg.
          cache-dependency-path: |
            requirements_test.txt
            .github/workflows/tests.yaml

      - name: Install dependencies
        run: |
          requirements=("homeassistant==${{ matrix.homeassistant }}")
          if [[ "${{ matrix.minimum }}" == "true" ]]; then
            # HA 2025.8 pins aiodns 3.5 but not pycares; pycares 5 removed
            # symbols that aiodns 3.5 imports, so today's resolver otherwise
            # creates an environment that fails before Home Assistant loads.
            requirements+=("pycares<5")
          else
            # pytest-homeassistant-custom-component pins ONE exact HA version
            # per release, so it can only be installed on the leg whose HA it
            # matches — 0.13.356 pins exactly 2026.8.2. The fixture-backed
            # flow tests skip themselves where it is absent, so the minimum
            # leg still runs everything else.
            requirements+=("pytest-homeassistant-custom-component==0.13.356")
          fi
          python -m pip install -r requirements_test.txt "${requirements[@]}"

      - name: Check generated entity docs are current
        run: python tools/gen_entity_docs.py --check

      - name: Run tests
        run: >-
          pytest tests/ -v --tb=short
          --cov=custom_components.mixergy_tank
          --cov-report=term-missing
          --cov-fail-under=95

  latest-ha-canary:
    name: Latest HA canary
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          # The big dependency (homeassistant==<matrix version>) comes from
          # the workflow, not requirements_test.txt — include this file in
          # the key so an HA version bump rotates the cache instead of
          # leaving it permanently stale for that leg.
          cache-dependency-path: |
            requirements_test.txt
            .github/workflows/tests.yaml
      - name: Install latest Home Assistant
        run: python -m pip install -r requirements_test.txt --upgrade homeassistant
      - name: Assert the canary actually got the latest release
        # The canary's whole purpose is testing the CURRENT core. If HA bumps
        # its Python floor above this job's pinned interpreter, pip silently
        # resolves an older release and the canary goes green against a core
        # nobody runs — fail loudly instead.
        run: |
          installed=$(python -c "from importlib.metadata import version; print(version('homeassistant'))")
          latest=$(curl -s https://pypi.org/pypi/homeassistant/json | python -c "import json,sys; print(json.load(sys.stdin)['info']['version'])")
          echo "installed=$installed latest=$latest"
          if [[ "$installed" != "$latest" ]]; then
            echo "::error::Canary resolved homeassistant $installed but PyPI latest is $latest — bump this job's python-version to match HA's floor"
            exit 1
          fi
      - name: Check generated entity docs are current
        run: python tools/gen_entity_docs.py --check
      - name: Run latest compatibility suite
        run: >-
          pytest tests/ -v --tb=short
          --cov=custom_components.mixergy_tank
          --cov-report=term-missing
          --cov-fail-under=95

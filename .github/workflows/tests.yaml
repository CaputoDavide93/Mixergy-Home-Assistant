name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly latest-HA canary catches core API churn between releases.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Minimum HA 2025.8.0
            python: "3.13"
            homeassistant: "2025.8.0"
            minimum: true
          - name: Current HA 2026.8.1
            python: "3.14"
            homeassistant: "2026.8.1"
            minimum: false

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install dependencies
        run: |
          requirements=("homeassistant==${{ matrix.homeassistant }}")
          if [[ "${{ matrix.minimum }}" == "true" ]]; then
            # HA 2025.8 pins aiodns 3.5 but not pycares; pycares 5 removed
            # symbols that aiodns 3.5 imports, so today's resolver otherwise
            # creates an environment that fails before Home Assistant loads.
            requirements+=("pycares<5")
          fi
          python -m pip install -r requirements_test.txt "${requirements[@]}"

      - name: Check generated entity docs are current
        run: python tools/gen_entity_docs.py --check

      - name: Run tests
        run: >-
          pytest tests/ -v --tb=short
          --cov=custom_components.mixergy
          --cov-report=term-missing
          --cov-fail-under=67

  latest-ha-canary:
    name: Latest HA canary
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install latest Home Assistant
        run: python -m pip install -r requirements_test.txt homeassistant
      - name: Run latest compatibility suite
        run: >-
          pytest tests/ -v --tb=short
          --cov=custom_components.mixergy
          --cov-report=term-missing
          --cov-fail-under=67

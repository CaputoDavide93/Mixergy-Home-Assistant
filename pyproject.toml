[tool.ruff]
# Match the Home Assistant core target so idioms flagged here are the same
# ones core would flag; the repo's manifest floor is HA 2025.8 (Python 3.13).
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# A deliberately small, high-signal set rather than everything ruff offers:
# correctness (E/F/W), import hygiene (I), modern syntax (UP), real bug
# patterns (B, RUF), and the try/except discipline that matters in an
# integration where a swallowed error becomes a silent unavailable entity (TRY).
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RET", "C4", "RUF", "TRY"]
ignore = [
    # The API client raises long, specific messages; splitting them into
    # variables to satisfy TRY003 would make them harder to read, not safer.
    "TRY003",
    # This codebase uses en dashes and box-drawing characters deliberately
    # (range copy like "30–300 seconds", "── section ──" rules). Every hit is
    # intentional typography, so these rules are pure noise here.
    "RUF001",
    "RUF002",
    "RUF003",
    # `raise ... from err` is used where the cause adds information; the bare
    # re-raise inside the coordinator's ladder is deliberate.
    "TRY300",
]

[tool.ruff.lint.per-file-ignores]
# Tests construct deliberately malformed payloads and long parametrise tables.
"tests/*" = [
    "E501",     # long parametrise tables read better unwrapped
    "B011",     # assert False is meaningful in tests
    "SIM117",   # nested `with patch(...)` is clearer than a combined form
    "B023",     # loop-variable closures are intentional in parametrised helpers
    "F811",     # re-imported fixtures//helpers inside test functions
]
"tools/*" = ["E501"]

[tool.mypy]
python_version = "3.13"
# Strict, which the strict-typing quality rule asks for. It was previously
# relaxed on the assumption that Home Assistant's partially-typed helpers
# would drown out real findings; in practice strict produced only two
# genuine errors, both from the UnitOfRatio compatibility shim, and both
# are now fixed at the source rather than silenced.
#
# ignore_missing_imports stays: some HA dependencies genuinely ship no stubs,
# and that is not something this repo can fix.
strict = true
ignore_missing_imports = true

[tool.coverage.report]
exclude_also = [
    # Type-checker-only blocks never execute at runtime by definition;
    # counting them as uncovered would push a module below the per-module
    # coverage bar for code that cannot be run.
    "if TYPE_CHECKING:",
]

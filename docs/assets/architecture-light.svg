<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 440" width="1180" height="440" role="img" aria-label="The Mixergy tank reports to the Mixergy cloud. The integration's coordinator polls the cloud API over HTTPS and feeds the Home Assistant entities, which supply the Energy Dashboard. Services and controls write back to the cloud."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#94a3b8"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M10 0 0 5 10 10z" fill="#94a3b8"/></marker></defs><rect x="640" y="40" width="520" height="316" rx="14" fill="#f7f9fb" stroke="#d8dee4" stroke-width="1" stroke-dasharray="6 5"/><text x="658.0" y="64.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6673" text-anchor="start" font-weight="600">HOME ASSISTANT</text><rect x="24" y="76" width="184" height="108" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(40.0,89.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></g><text x="71.0" y="104.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Mixergy tank</text><text x="40.0" y="128.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">Reports to the cloud</text><text x="40.0" y="146.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">about every 60 s</text><rect x="284" y="76" width="232" height="108" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(300.0,89.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.1 9.5 4.3 4.3 0 0 0 7 18z"/></g><text x="331.0" y="104.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Mixergy cloud</text><text x="300.0" y="128.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">www.mixergy.io/api/v2</text><text x="300.0" y="146.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">REST, HATEOAS links</text><rect x="660" y="76" width="220" height="108" rx="10" fill="#2b59c3" stroke="#2b59c3" stroke-width="1"/><g transform="translate(676.0,89.0) scale(0.8750)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v6H4z M4 14h16v6H4z M7 7h.01 M7 17h.01 M11 7h6 M11 17h6"/></g><text x="707.0" y="104.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#ffffff" text-anchor="start" font-weight="600">Coordinator</text><text x="676.0" y="128.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" opacity="0.85">One per tank, polls every</text><text x="676.0" y="146.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" opacity="0.85">60 s (30 to 300 s)</text><rect x="928" y="76" width="208" height="108" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(944.0,89.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8h8v8H8z M5 5h14v14H5z M10 2v3 M14 2v3 M10 19v3 M14 19v3 M2 10h3 M2 14h3 M19 10h3 M19 14h3"/></g><text x="975.0" y="104.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Entities</text><text x="944.0" y="128.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">8 platforms, from sensors</text><text x="944.0" y="146.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">to the water heater</text><rect x="660" y="240" width="220" height="92" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(676.0,253.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.4z"/></g><text x="707.0" y="268.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Services, controls</text><text x="676.0" y="292.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">3 services, plus number,</text><text x="676.0" y="310.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">switch and select entities</text><rect x="928" y="240" width="208" height="92" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(944.0,253.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V4 M4 20h16 M8 16v-5 M12 16V8 M16 16v-3"/></g><text x="975.0" y="268.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Energy dashboard</text><text x="944.0" y="292.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">Individual devices</text><polyline points="216,130.0 276,130.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#b)"/><text x="246.0" y="121.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">reports</text><text x="246.0" y="150.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">commands</text><polyline points="524,130.0 652,130.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="588.0" y="121.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">3 GETs / poll</text><text x="588.0" y="150.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">HTTPS, bearer</text><polyline points="888,130.0 920,130.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><polyline points="1032,192 1032,232" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="1042.0" y="216.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="start">kWh totals</text><polyline points="652,286.0 400,286.0 400,192" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="526.0" y="277.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">PUT, then refresh</text><line x1="24" y1="388" x2="1156" y2="388" stroke="#e6e9ee" stroke-width="1"/><text x="24.0" y="414.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">Cloud only: nothing talks to the tank locally. Energy totals are integrated from polled power, so they approximate the Mixergy app.</text></svg>
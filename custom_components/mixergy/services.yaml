# Field selectors for Mixergy services.
# Human-readable names and descriptions live in strings.json / translations/.

set_holiday_dates:
  target:
    entity:
      integration: mixergy
    device:
      integration: mixergy
    area: {}
  fields:
    start_date:
      required: true
      example: "2026-03-15 16:00:00"
      selector:
        datetime:
    end_date:
      required: true
      example: "2026-03-22 12:00:00"
      selector:
        datetime:
    serial_number:
      required: false
      advanced: true
      example: "MX0000000000"
      selector:
        text:

